[project]
name = "telegram-info-bot"
version = "0.1.0"
description = "Telegram identity helper with a FastAPI webhook"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.14"
dependencies = ["aiogram>=3.31,<4", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-dotenv>=1,<2", "pydantic>=2.12,<3"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "httpx>=0.28,<1", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]

[tool.hatch.build.targets.sdist]
only-include = [
  "src", "tests", "scripts", "docs", ".github", "README.md", "pyproject.toml",
  "uv.lock", "Dockerfile", ".dockerignore", ".env.example", ".python-version", ".gitignore", "LICENSE",
]
